    <!-- 添加认证检查脚本 -->
    <script>
        // 页面加载时立即检查认证状态
        document.addEventListener('DOMContentLoaded', function() {
            async function checkAuth() {                try {
                    const token = localStorage.getItem('access_token');
                    if (!token) {
                        console.error('未找到访问令牌，未登录状态');
                        throw new Error('未登录');
                    }
                    
                    console.log('找到访问令牌，长度:', token.length);
                    
                    // 设置拦截器为所有请求添加认证头
                    const originalFetch = window.fetch;
                    window.fetch = function() {
                        const args = Array.prototype.slice.call(arguments);
                        if (args[1] === undefined) {
                            args[1] = {};
                        }
                        if (args[1].headers === undefined) {
                            args[1].headers = {};
                        }
                        args[1].headers['Authorization'] = `Bearer ${token}`;
                        return originalFetch.apply(this, args);
                    };

                    console.log('正在验证令牌...');
                    
                    // 验证令牌并检查用户权限
                    const response = await fetch('/users/me');
                    console.log('验证响应状态:', response.status);
                    
                    if (!response.ok) {
                        const errorText = await response.text();
                        console.error('认证失败，服务器响应:', errorText);
                        throw new Error(`认证失败 (${response.status}): ${errorText}`);
                    }
                    
                    const user = await response.json();
                    console.log('获取到用户信息:', user);
                    
                    if (user.role !== 'patient' && user.role !== 'admin') {
                        console.error('权限不足，用户角色:', user.role);
                        throw new Error(`权限不足，需要患者权限，当前角色: ${user.role}`);
                    }
                    
                    console.log('认证成功:', user);
                    // 存储用户信息
                    localStorage.setItem('user_data', JSON.stringify(user));
                    
                } catch (error) {
                    console.error('认证失败:', error);
                    // 清除认证信息
                    localStorage.removeItem('access_token');
                    localStorage.removeItem('user_role');
                    localStorage.removeItem('user_data');
                    // 重定向到登录页面
                    window.location.href = '/login';
                }
            }
            
            // 执行认证检查
            checkAuth();
        });
    </script>

    </footer>    <script>
        // 页面加载完成后执行
        document.addEventListener('DOMContentLoaded', function() {
            // 获取用户姓名并显示问候语
            const userData = JSON.parse(localStorage.getItem('user_data') || '{}');
            const userName = userData.username || '用户';
            const userGreeting = document.getElementById('user-greeting');
            if (userGreeting) {
                userGreeting.textContent = `欢迎回来，${userName}！`;
            }
            
            // 初始化情绪趋势图表
            initMoodChart();
            
            // 表单提交处理
            const uploadForm = document.getElementById('upload-form');
            if (uploadForm) {
                uploadForm.addEventListener('submit', function(e) {
                    e.preventDefault();
                    
                    const videoInput = document.getElementById('video-upload');
                    const progressBar = document.getElementById('upload-progress');
                    const progressContainer = document.getElementById('upload-progress-container');
                    const resultContainer = document.getElementById('result-container');
                    
                    if (!videoInput.files || videoInput.files.length === 0) {
                        showAlert('请选择一个视频文件', 'danger');
                        return;
                    }
                    
                    const formData = new FormData();
                    formData.append('video_file', videoInput.files[0]);
                    
                    // 显示进度条
                    if (progressContainer) {
                        progressContainer.style.display = 'block';
                    }
                    if (progressBar) {
                        progressBar.value = 0;
                    }
                    
                    // 显示加载提示
                    if (resultContainer) {
                        resultContainer.innerHTML = `
                            <div class="card">
                                <div class="card-body text-center">
                                    <div class="loader"></div>
                                    <p class="mt-3">正在处理视频，请稍候...</p>
                                    <p class="text-muted">视频分析可能需要几分钟时间</p>
                                </div>
                            </div>
                        `;
                    }
                      // 模拟进度
                    let progress = 0;
                    const progressInterval = setInterval(() => {
                        progress += 3;
                        if (progressBar && progress <= 95) {
                            progressBar.value = progress;
                        }
                    }, 800);
                    
                    const token = localStorage.getItem('access_token');
                    
                    fetch('/predict', {
                        method: 'POST',
                        body: formData,
                        headers: {
                            'Authorization': `Bearer ${token}`
                        }
                    })
                    .then(response => {
                        if (!response.ok) {
                            throw new Error('服务器返回错误：' + response.status);
                        }
                        return response.json();
                    })
                    .then(data => {                        clearInterval(progressInterval);
                        if (progressBar) {
                            progressBar.value = 100;
                        }
                        if (progressContainer) {
                            setTimeout(() => {
                                progressContainer.style.display = 'none';
                            }, 500);
                        }
                        
                        const isDepressed = data.depression_probability > 0.5;
                        const resultClass = isDepressed ? 'danger' : 'success';
                        const resultText = isDepressed ? '存在抑郁风险' : '情绪状态良好';
                        const resultIcon = isDepressed ? 'fa-exclamation-triangle' : 'fa-check-circle';
                        const depressionPercent = (data.depression_probability * 100).toFixed(1);
                        const normalPercent = (data.non_depression_probability * 100).toFixed(1);
                        
                        if (resultContainer) {
                            resultContainer.innerHTML = `
                                <div class="result-card">
                                    <div class="result-media">
                                        <video id="result-video" controls></video>
                                    </div>
                                    <div class="result-content">
                                        <h3 class="result-title">分析结果</h3>
                                        <div class="result-meta">
                                            <div class="result-meta-item">
                                                <i class="fas fa-calendar icon"></i> ${new Date().toLocaleDateString('zh-CN')}
                                            </div>
                                            <div class="result-meta-item">
                                                <i class="fas fa-clock icon"></i> ${new Date().toLocaleTimeString('zh-CN')}
                                            </div>
                                        </div>
                                        <div class="alert alert-${resultClass}">
                                            <i class="fas ${resultIcon} alert-icon"></i>
                                            <div class="alert-content">
                                                <strong>${resultText}</strong>
                                                <p>${isDepressed ? '建议咨询医生获取专业帮助' : '继续保持积极心态'}</p>
                                            </div>
                                        </div>
                                        <div class="result-stats">
                                            <div class="result-stat">
                                                <div class="result-stat-label">抑郁风险指数</div>
                                                <div class="result-progress">
                                                    <div class="result-progress-bar result-progress-depression" style="width: ${depressionPercent}%"></div>
                                                </div>
                                                <div class="text-right mt-1">${depressionPercent}%</div>
                                            </div>
                                            <div class="result-stat">
                                                <div class="result-stat-label">健康心理指数</div>
                                                <div class="result-progress">
                                                    <div class="result-progress-bar result-progress-normal" style="width: ${normalPercent}%"></div>
                                                </div>
                                                <div class="text-right mt-1">${normalPercent}%</div>
                                            </div>
                                        </div>
                                        <div class="result-actions">
                                            <button class="btn" onclick="viewResultDetails()">查看详细报告</button>
                                            <button class="btn btn-outline">下载分析报告</button>
                                        </div>
                                    </div>
                                </div>
                            `;
                            
                            // 更新图表
                            updateMoodChart(data.depression_probability);
                        }
                        
                        // 刷新历史记录
                        fetchUserHistory();
                    })
                    .catch(error => {
                        clearInterval(progressInterval);
                        console.error('上传分析失败:', error);
                        if (resultContainer) {
                            resultContainer.innerHTML = `
                                <div class="alert alert-danger">
                                    <i class="fas fa-exclamation-circle alert-icon"></i>
                                    <div class="alert-content">
                                        <strong>分析失败</strong>
                                        <p>请稍后再试。错误：${error.message}</p>
                                    </div>
                                </div>
                            `;
                        }
                        if (progressContainer) {
                            progressContainer.style.display = 'none';
                        }
                    });
                });
            }
              // 加载历史记录
            fetchUserHistory();
            
            // 视频预览功能
            const videoInput = document.getElementById('video-upload');
            const previewContainer = document.getElementById('preview-container');
            
            if (videoInput && previewContainer) {
                videoInput.addEventListener('change', function() {
                    if (this.files && this.files[0]) {
                        const file = this.files[0];
                        const fileReader = new FileReader();
                        
                        // 显示文件信息
                        const fileSize = (file.size / (1024 * 1024)).toFixed(2);
                        const fileDate = new Date(file.lastModified).toLocaleString();
                        
                        fileReader.onload = function(e) {
                            previewContainer.innerHTML = `
                                <div class="card">
                                    <div class="card-body">
                                        <div class="d-flex justify-between align-center mb-3">
                                            <h3 class="mb-0">视频预览</h3>
                                            <span class="badge badge-success">已选择</span>
                                        </div>
                                        <video controls width="100%" style="max-height: 300px; border-radius: var(--radius-sm);">
                                            <source src="${e.target.result}" type="${file.type}">
                                            您的浏览器不支持视频标签。
                                        </video>
                                        <div class="d-flex justify-between mt-2">
                                            <div class="text-muted"><i class="fas fa-film"></i> ${file.name}</div>
                                            <div class="text-muted"><i class="fas fa-weight"></i> ${fileSize} MB</div>
                                        </div>
                                    </div>
                                </div>
                            `;
                        };
                        
                        fileReader.readAsDataURL(file);
                    }
                });
            }
        });
        
        // 初始化情绪趋势图表
        function initMoodChart() {
            const ctx = document.getElementById('mood-chart');
            if (!ctx) return;
            
            // 模拟过去30天的数据
            const labels = Array.from({length: 30}, (_, i) => {
                const date = new Date();
                date.setDate(date.getDate() - (29 - i));
                return `${date.getMonth() + 1}/${date.getDate()}`;
            });
            
            const depressionData = [65, 62, 60, 63, 58, 57, 59, 55, 50, 52, 48, 45, 40, 42, 38, 35, 30, 32, 28, 30, 25, 27, 22, 20, 22, 18, 15, 17, 12, 10];
            const normalData = depressionData.map(val => 100 - val);
            
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '健康心理指数',
                        data: normalData,
                        borderColor: '#34a853',
                        backgroundColor: 'rgba(52, 168, 83, 0.1)',
                        tension: 0.3,
                        fill: true
                    }, {
                        label: '抑郁风险指数',
                        data: depressionData,
                        borderColor: '#ea4335',
                        backgroundColor: 'rgba(234, 67, 53, 0.1)',
                        tension: 0.3,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            position: 'top',
                        },
                        tooltip: {
                            mode: 'index',
                            intersect: false,
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 100,
                            title: {
                                display: true,
                                text: '百分比 (%)'
                            }
                        }
                    }
                }
            });
        }
        
        // 更新图表数据
        function updateMoodChart(depressionValue) {
            // 在实际应用中，这里将更新图表数据
            console.log('更新情绪图表:', depressionValue);
        }
        
        // 显示结果详情
        function viewResultDetails() {
            const detailsSection = document.getElementById('result-details');
            if (detailsSection) {
                detailsSection.style.display = 'block';
                detailsSection.scrollIntoView({ behavior: 'smooth' });

        }
        
        // 显示提示信息
        function showAlert(message, type = 'info') {
            const alertElement = document.createElement('div');
            alertElement.className = `alert alert-${type}`;
            alertElement.innerHTML = `

            setTimeout(() => {
                alertElement.style.opacity = '0';
                setTimeout(() => alertElement.remove(), 500);
            }, 3000);
        }
        
        // 获取用户历史记录
        function fetchUserHistory() {
            const token = localStorage.getItem('access_token');
            const historyContainer = document.getElementById('history-container');
            
            if (!token) {
                window.location.href = '/login';
                return;
            }
            
            if (historyContainer) {
                historyContainer.innerHTML = `
                    <div class="loader"></div>
                    <div class="text-center text-muted mt-3">正在加载历史记录...</div>
                `;
                  fetch('/api/history', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('获取历史记录失败');
                    }
                    return response.json();
                })
                .then(data => {
                    if (data && data.length > 0) {
                        let html = '<div class="table-container table-responsive"><table class="table-striped">';
                        html += `
                            <thead>
                                <tr>
                                    <th>日期</th>
                                    <th>视频</th>
                                    <th>分析结果</th>
                                    <th>风险指数</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody>
                        `;
                        
                        // 显示最近的10条记录
                        const recentData = data.slice(0, 10);
                        recentData.forEach(item => {
                            const date = new Date(item.created_at).toLocaleDateString('zh-CN');
                            const time = new Date(item.created_at).toLocaleTimeString('zh-CN');
                            const isDepressed = item.predicted_class === 'depressed';
                            const resultClass = isDepressed ? 'danger' : 'success';
                            const statusText = isDepressed ? '存在风险' : '状态良好';
                            const depressionValue = isDepressed ? 85 : 20; // 模拟数据
                            
                            html += `
                                <tr>
                                    <td>
                                        <div>${date}</div>
                                        <div class="text-muted">${time}</div>
                                    </td>
                                    <td>
                                        <div class="d-flex align-center">
                                            <div class="mr-2" style="width:30px; height:30px; background:#eee; border-radius:4px; display:flex; align-items:center; justify-content:center;">
                                                <i class="fas fa-video"></i>
                                            </div>
                                            <div>${item.filename || '分析记录' + (item.id)}</div>
                                        </div>
                                    </td>
                                    <td>
                                        <span class="badge badge-${resultClass}">${statusText}</span>
                                    </td>
                                    <td>
                                        <div class="result-progress" style="width: 100px;">
                                            <div class="result-progress-bar result-progress-${isDepressed ? 'depression' : 'normal'}" style="width: ${depressionValue}%"></div>
                                        </div>
                                    </td>
                                    <td>
                                        <button class="btn btn-sm" data-result-id="${item.id}">查看详情</button>
                                    </td>
                                </tr>
                            `;
                        });
                        html += '</tbody></table></div>';
                        
                        if (data.length > 10) {
                            html += `
                                <div class="text-center mt-3">
                                    <button class="btn btn-outline">查看更多历史记录</button>
                                </div>
                            `;
                        }
                        
                        historyContainer.innerHTML = html;
                          // 绑定查看详情按钮事件
                        document.querySelectorAll('[data-result-id]').forEach(button => {
                            button.addEventListener('click', function() {
                                const resultId = this.getAttribute('data-result-id');
                                fetchAndDisplayResult(resultId);
                            });
                        });
                    } else {
                        historyContainer.innerHTML = `
                            <div class="text-center p-4">
                                <i class="fas fa-history" style="font-size: 3rem; color: var(--border-color);"></i>
                                <h3 class="mt-3">暂无历史记录</h3>
                                <p class="text-muted">上传您的第一个视频以开始分析</p>
                            </div>
                        `;
                    }
                })                .catch(error => {
                    console.error('获取历史记录失败:', error);
                    historyContainer.innerHTML = `
                        <div class="alert alert-danger">
                            <i class="fas fa-exclamation-circle alert-icon"></i>
                            <div class="alert-content">
                                <strong>加载失败</strong>
                                <p>无法获取历史记录，请稍后再试</p>
                            </div>
                        </div>
                    `;
                });
            }
        }

        // 获取并显示分析结果详情
        function fetchAndDisplayResult(resultId) {
            const token = localStorage.getItem('access_token');
            const detailsContainer = document.getElementById('result-details');
            
            if (detailsContainer) {
                detailsContainer.innerHTML = `
                    <div class="card">
                        <div class="card-body text-center">
                            <div class="loader"></div>
                            <p class="mt-3">正在加载详情...</p>
                        </div>
                    </div>
                `;
                detailsContainer.style.display = 'block';
                  fetch(`/api/result/${resultId}`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('获取分析结果失败');
                    }
                    return response.json();
                })
                .then(result => {
                    const isDepressed = result.predicted_class === 'depressed' || (result.probability_class1 && result.probability_class1 > 0.5);
                    const depressionProb = result.probability_class1 ? result.probability_class1 : (isDepressed ? 0.75 : 0.25);
                    const normalProb = result.probability_class0 ? result.probability_class0 : (1 - depressionProb);
                    const resultClass = isDepressed ? 'danger' : 'success';
                    const resultText = isDepressed ? '存在抑郁风险' : '情绪状态良好';
                    const resultIcon = isDepressed ? 'fa-exclamation-triangle' : 'fa-check-circle';
                    const depressionPercent = (depressionProb * 100).toFixed(1);
                    const normalPercent = (normalProb * 100).toFixed(1);
                    const date = new Date(result.created_at).toLocaleDateString('zh-CN');
                    const time = new Date(result.created_at).toLocaleTimeString('zh-CN');
                    
                    detailsContainer.innerHTML = `
                        <div class="viz-grid">
                            <div class="viz-card">
                                <div class="viz-card-header">
                                    <h3 class="viz-card-title">结果概览</h3>
                                </div>
                                <div class="viz-card-body">
                                    <div class="alert alert-${resultClass} mb-3">
                                        <i class="fas ${resultIcon} alert-icon"></i>
                                        <div class="alert-content">
                                            <strong>${resultText}</strong>
                                            <p>${isDepressed ? '建议咨询医生获取专业帮助' : '继续保持积极心态'}</p>
                                        </div>
                                    </div>
                                    
                                    <div class="result-meta mb-3">
                                        <div class="result-meta-item">
                                            <i class="fas fa-calendar icon"></i> ${date}
                                        </div>
                                        <div class="result-meta-item">
                                            <i class="fas fa-clock icon"></i> ${time}
                                        </div>
                                        <div class="result-meta-item">
                                            <i class="fas fa-file-video icon"></i> ${result.filename || '视频分析 #' + resultId}
                                        </div>
                                    </div>
                                    
                                    <div class="result-stats">
                                        <div class="result-stat">
                                            <div class="result-stat-label">抑郁风险指数</div>
                                            <div class="result-progress">
                                                <div class="result-progress-bar result-progress-depression" style="width: ${depressionPercent}%"></div>
                                            </div>
                                            <div class="text-right mt-1">${depressionPercent}%</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="viz-card">
                                <div class="viz-card-header">
                                    <h3 class="viz-card-title">详细分析</h3>
                                </div>
                                <div class="viz-card-body">
                                    <canvas id="detail-chart" style="width:100%; height:200px;"></canvas>
                                    
                                    ${result.metadata ? `
                                        <div class="mt-3 pt-3" style="border-top: 1px solid var(--border-color);">
                                            <h4>技术分析数据</h4>
                                            <pre style="background: #f5f5f5; padding: 10px; border-radius: var(--radius-sm); max-height: 150px; overflow: auto;">${JSON.stringify(result.metadata, null, 2)}</pre>
                                        </div>
                                    ` : ''}
                                </div>
                            </div>
                        </div>
                        
                        <div class="card mt-4">
                            <div class="card-header">
                                <h3>专业建议</h3>
                            </div>
                            <div class="card-body">
                                ${isDepressed ? `
                                    <p>基于分析结果，我们建议您:</p>
                                    <ul>
                                        <li>考虑咨询专业心理医生进行进一步评估</li>
                                        <li>保持规律的生活作息和健康的饮食习惯</li>
                                        <li>适当增加体育锻炼，每天至少30分钟</li>
                                        <li>寻求亲友支持，保持社交活动</li>
                                        <li>学习简单的放松技巧，如冥想或深呼吸</li>
                                    </ul>
                                ` : `
                                    <p>您的情绪状态良好，我们建议您:</p>
                                    <ul>
                                        <li>继续保持积极的生活态度</li>
                                        <li>定期进行自我情绪评估</li>
                                        <li>保持良好的作息习惯和社交活动</li>
                                    </ul>
                                `}
                            </div>
                        </div>
                        
                        <div class="card-footer mt-3 d-flex justify-between">
                            <button class="btn btn-outline" onclick="document.getElementById('result-details').style.display='none'">关闭详情</button>
                            <button class="btn">下载完整报告</button>
                        </div>
                    `;
                    
                    // 初始化详情图表
                    const detailCtx = document.getElementById('detail-chart');
                    if (detailCtx) {
                        new Chart(detailCtx, {
                            type: 'radar',
                            data: {
                                labels: ['悲伤', '焦虑', '愤怒', '情绪波动', '睡眠问题', '社交兴趣'],
                                datasets: [{
                                    label: '情绪因素分析',
                                    data: [
                                        isDepressed ? 75 : 25, 
                                        isDepressed ? 80 : 30, 
                                        isDepressed ? 60 : 20, 
                                        isDepressed ? 85 : 15, 
                                        isDepressed ? 70 : 25, 
                                        isDepressed ? 90 : 30
                                    ],
                                    fill: true,
                                    backgroundColor: 'rgba(66, 133, 244, 0.2)',
                                    borderColor: 'rgba(66, 133, 244, 1)',
                                    pointBackgroundColor: 'rgba(66, 133, 244, 1)',
                                    pointBorderColor: '#fff',
                                    pointHoverBackgroundColor: '#fff',
                                    pointHoverBorderColor: 'rgba(66, 133, 244, 1)'
                                }]
                            },
                            options: {
                                scales: {
                                    r: {
                                        angleLines: {
                                            display: true
                                        },
                                        suggestedMin: 0,
                                        suggestedMax: 100
                                    }
                                }
                            }
                        });
                    }
                })
                .catch(error => {
                    console.error('获取结果详情失败:', error);
                    detailsContainer.innerHTML = `
                        <div class="alert alert-danger">
                            <i class="fas fa-exclamation-circle alert-icon"></i>
                            <div class="alert-content">
                                <strong>加载失败</strong>
                                <p>无法获取详细结果，请稍后再试</p>
                            </div>
                        </div>
                    `;
                });
            }
        }
        
        // 退出登录函数
        function logout() {
            localStorage.removeItem('access_token');
            localStorage.removeItem('user_role');
            localStorage.removeItem('user_data');
            window.location.href = '/login';
        }
    </script>
</body>
</html>
